stages:
  - check
  - mirror

checks:
  stage: check
  script:
    - mkdir -p sim/results
    - uv run poe checks
    - uv run poe notebook
    - uv run poe build
    - uv run pytest --junitxml=junit.xml
    - uv run poe cover
    - uv run coverage xml
    # ERC is a hard gate. DRC is reported but not gated yet: the board still carries
    # the 5-connection routing punch list documented in readme.md — flip it to a gate
    # (drop the "|| true") once those are routed.
    - if command -v kicad-cli >/dev/null; then kicad-cli version; else echo "kicad-cli not on this runner — ERC/DRC not checked in CI"; fi
    - if command -v kicad-cli >/dev/null; then uv run poe validate-model; fi
    # DRC is informational: the runner's KiCad 9 cannot open a KiCad 10 board file,
    # and the board still carries the routing punch list documented in readme.md.
    - if command -v kicad-cli >/dev/null; then uv run poe validate-asm || echo "DRC not gated — see the message above and the board-status section of readme.md"; fi
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    # Keep the ERC/DRC reports: when a gate fails, the counts alone do not say which
    # rule fired, and the runner's KiCad may not match a developer's.
    paths:
      - dlr_carrier-erc.rpt
      - dlr_carrier-drc.rpt
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/dlr-pcb.git
  only:
    - main
