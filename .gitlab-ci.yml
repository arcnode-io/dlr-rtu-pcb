stages:
  - check
  - mirror

checks:
  stage: check
  script:
    - mkdir -p sim/results
    - uv run poe checks
    - uv run poe notebook
    - uv run poe build
    - uv run pytest --junitxml=junit.xml
    - uv run poe cover
    - uv run coverage xml
    # ERC + DRC are hard gates wherever the runner has KiCad (both tasks exit non-zero on violations)
    - if command -v kicad-cli >/dev/null; then uv run poe validate-model && uv run poe validate-asm; else echo "kicad-cli not on this runner — ERC/DRC not checked in CI"; fi
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

mirror:
  stage: mirror
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main
    - git push --mirror git@github.com:arcnode-io/dlr-pcb.git
  only:
    - main
