# Component placement for cad/drawing/place_pcb.py — DLR carrier (mm from board origin, rotation deg)
#
# Layout on the 120x105 board:
#   Top-left:      SOLAR MPPT CHARGER (PV terminal, BQ24650 + FETs + 6.8uH, sense)
#   Left-middle:   5V buck (LMR33630 + 10uH + 470uF) and the 3V3 / 3V8 LDOs
#   Top-centre:    USB-C commissioning port (board edge, next to CM4 USB pins)
#   Top-right:     SoM (CM4 Hirose connector)
#   Mid-left:      SENSORS (FLIR FFC at left edge, DHT, SI, YL, ADS)
#   Mid-right:     CELLULAR (BG770A modem, TXS shifter, SIM, U.FL)
#   Bottom-left:   BAT terminal
#   Bottom-centre: ANEMOMETER RS-485 (SP3485 + M12 header at bottom edge) + DEBUG_UART
board_size: [120, 105]
board_origin: [100, 80]

blocks:
  charger:
    components:
      J1:  [10, 12, 0]      # PV terminal (5.08mm screw), left edge
      D1:  [22, 7,  0]      # SS34 reverse-polarity diode
      C1:  [22, 12, 0]      # 22uF/50V PV input bulk
      R17: [22, 16, 0]      # 10R VCC filter
      C31: [22, 19, 0]      # 1uF VCC
      R18: [30, 7,  0]      # 130k MPPSET top
      R19: [33, 7,  0]      # 10k MPPSET bottom
      R20: [36, 7,  0]      # 297k VFB top (0.1%)
      R21: [39, 7,  0]      # 49.9k VFB bottom (0.1%)
      U8:  [34, 14, 0]      # BQ24650RVAR
      C32: [29, 21, 0]      # 1uF VREF
      C33: [32, 21, 0]      # 1uF REGN
      R22: [24, 20, 0]      # 10k TS top
      R23: [27, 20, 0]      # 15k TS bottom
      R24: [24, 23, 0]      # 10k STAT1 pull-up
      R25: [27, 23, 0]      # 10k STAT2 pull-up
      Q1:  [44, 10, 0]      # DMN4035L-7 high-side
      Q2:  [44, 15, 0]      # DMN4035L-7 low-side
      C2:  [48, 7,  0]      # 100nF bootstrap PH-BTST
      D4:  [48, 12, 0]      # BAT54W bootstrap REGN->BTST
      L1:  [56, 12, 0]      # SRN8040TA-6R8M
      # Reason: SLUSA75B §11.1 — keep the sense resistor and its filter next to the
      # SRP/SRN pins. R1 previously sat 32 mm away with the sense pair crossing the
      # whole charger block, which is also where the router ran out of room.
      R1:  [46, 22, 0]      # 20m sense (1206), close to U8 pins 9/10
      C34: [40, 22, 0]      # 100nF SRP-SRN differential
      C35: [36, 25, 0]      # 100nF SRN-GND common-mode
      C3:  [56, 22, 0]      # 22uF/50V charger output

  power:
    components:
      C4:  [25, 28, 0]      # 10uF/50V buck input (1206)
      C5:  [25, 33, 0]      # 220nF/50V buck input HF
      U9:  [38, 30, 0]      # LMR33630ADDA
      C36: [32, 37, 0]      # 1uF VCC (internal LDO, §9.2.2.8)
      C6:  [44, 36, 0]      # 100nF BOOT
      L2:  [52, 30, 0]      # SRN8040TA-100M
      C7:  [63, 32, 0]      # 470uF polymer bulk
      C8:  [63, 39, 0]      # 22uF buck output
      C9:  [50, 38, 0]      # 100nF buck output
      R2:  [70, 28, 90]     # 100k FB top
      R3:  [70, 32, 90]     # 24.9k FB bottom
      U1:  [25, 46, 0]      # AP2112K-3.3 LDO
      U2:  [42, 46, 0]      # LP5907-3.8 LDO
      C10: [25, 52, 0]      # AP2112K Cin
      C11: [31, 52, 0]      # AP2112K Cout
      C12: [42, 52, 0]      # LP5907 Cin
      C13: [48, 52, 0]      # LP5907 Cout

  commissioning_usb:
    components:
      J12: [77, 4, 0]       # USB-C receptacle, opening 3mm back from the top edge
      R12: [72, 16, 0]      # CC1 5.1k Rd
      R13: [88, 16, 0]      # CC2 5.1k Rd

  som:
    components:
      # Reason: the DF40's 0.4 mm pitch needs a clear fan-out channel on both sides;
      # the decoupling caps sat 10 mm below and closed off the southern escape.
      J5:  [98, 16, 0]      # CM4_J2 Hirose (12x5mm)
      C14: [86, 28, 0]      # CM4 5V decoupling
      C15: [98, 28, 0]
      C16: [110, 28, 0]
      C17: [114, 16, 90]

  cellular:
    components:
      U3:  [92, 58, 0]      # BG770A-NA modem (22x26)
      U4:  [110, 50, 90]    # TXS0108E shifter
      J6:  [78, 45, 0]      # U.FL antenna
      J7:  [110, 82, 0]     # microSIM — library courtyard is 12x15, keep clear of U3
      C18: [78, 38, 0]      # 4.7uF VBAT_BB bulk
      C19: [82, 38, 0]      # 100nF VBAT_BB
      C20: [86, 38, 0]      # 100nF VDD_EXT_1V8
      C21: [72, 40, 0]      # ANT_IN DNP shunt
      C22: [90, 32, 0]      # ANT_MATCH DNP shunt
      C23: [104, 38, 0]     # USB_EXT_1V8
      C24: [114, 40, 0]     # 3V3 deco
      R5:  [70, 50, 0]      # ANT 0R series
      R6:  [82, 75, 90]     # OE pull-down
      R7:  [86, 75, 90]     # spare network resistor

  sensors:
    components:
      J8:  [7, 66, 270]     # FLIR Lepton FFC (FH12-14S); rot 270 puts the cable side on the left edge
      J9:  [25, 60, 0]      # SI1145 5-pin
      U5:  [25, 75, 0]      # DHT22
      J10: [40, 60, 0]      # YL-83 4-pin
      U6:  [40, 75, 0]      # ADS1115 MSOP-10
      C25: [30, 68, 0]      # FLIR deco
      C26: [35, 68, 0]      # SI deco
      C27: [45, 68, 0]      # ADS deco
      C28: [50, 68, 0]      # ADS bulk
      C29: [50, 78, 90]     # ADS anti-alias
      R8:  [55, 60, 90]     # DHT22 pull-up
      R9:  [55, 64, 90]     # PWR_DN pull-up
      R10: [55, 68, 90]     # I2C SDA pull-up
      R11: [55, 72, 90]     # I2C SCL pull-up

  connectors:
    components:
      J3:  [12, 96, 0]      # BAT terminal (5.08mm screw) at bottom-left corner
      J11: [70, 84, 0]      # debug UART 4-pin (bottom edge, narrow strip)

  anemometer:
    components:
      J13: [40, 96, 90]     # M12-5P placeholder header along bottom edge
      U7:  [52, 88, 0]      # SP3485EN transceiver
      C30: [52, 93, 0]      # SP3485 VCC bypass
      R14: [60, 86, 90]     # 120R termination
      R15: [60, 90, 90]     # 680R bias A->3V3
      R16: [60, 94, 90]     # 680R bias B->GND
      D2:  [40, 88, 0]      # SM712 dual TVS on A/B
      F1:  [33, 88, 0]      # 250mA polyfuse, VBAT -> sensor V+ (below the DHT22 courtyard)
      D3:  [28, 94, 0]      # SMBJ24CA (SMB) surge clamp on sensor V+

layout_rules:
  min_component_spacing: 2
  edge_clearance: 5
